; JLS-1 — Lab Voice Satellite firmware
; See ../docs/lab_audio_satellite_design.md for the hardware/protocol this targets.

[env:esp32-s3-devkitc-1]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Pinned to a platform version known to map to arduino-esp32 core 2.0.x, where the
; legacy driver/i2s.h API used in src/main.cpp is well-exercised. Newer platform
; versions (core 3.x) may print deprecation warnings on the legacy I2S calls but
; should still build and run — bump the pin here once that's actually verified on
; your bench, don't just delete it.
lib_deps =
    links2004/WebSockets @ ^2.4.1
    adafruit/Adafruit NeoPixel @ ^1.12.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
